<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clavis Team Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f3eee3; --paper:#fffdf8; --chalk:#1f3b30; --gold:#d9a62e; --ink:#21281f; --muted:#6e7a6c; --line:#dbd5c5; --red:#b8433a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
    .wrap { max-width:1040px; min-height:100vh; margin:auto; padding:24px 16px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .top h1 { margin:0; color:var(--chalk); font-family:'Fraunces',serif; font-size:28px; }
    .back { color:var(--chalk); font-size:13px; font-weight:700; text-decoration:none; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:16px; }
    .card { border:1px solid var(--line); border-radius:14px; background:var(--paper); box-shadow:0 8px 24px rgba(31,59,48,.06); }
    .call-card { overflow:hidden; }
    .call-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; border-bottom:1px solid var(--line); }
    .call-head strong { color:var(--chalk); font-family:'Fraunces',serif; }
    .call-status { color:var(--muted); font-size:12px; }
    .call-frame { display:none; width:100%; height:min(620px,calc(100vh - 190px)); border:0; background:#111; }
    .call-frame.open { display:block; }
    .call-empty { min-height:220px; display:grid; place-items:center; padding:24px; color:var(--muted); text-align:center; }
    .call-actions { display:flex; gap:8px; padding:12px 14px; }
    button { min-height:42px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
    .call-actions button { flex:1; }
    button.primary { border-color:var(--chalk); background:var(--chalk); color:#fff; }
    button.danger { border-color:var(--red); color:var(--red); }
    button:disabled { opacity:.55; cursor:wait; }
    .chat-card { height:min(720px,calc(100vh - 100px)); display:grid; grid-template-rows:auto 1fr auto; }
    .chat-head { padding:14px; border-bottom:1px solid var(--line); color:var(--chalk); font-size:13px; font-weight:800; }
    .chat-log { overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:12px; background:#fbfaf5; }
    .message { max-width:88%; align-self:flex-start; padding:8px 10px; border:1px solid var(--line); border-radius:12px 12px 12px 4px; background:#fff; font-size:12.5px; line-height:1.45; overflow-wrap:anywhere; }
    .message.mine { align-self:flex-end; border:0; border-radius:12px 12px 4px 12px; background:var(--chalk); color:#fff; }
    .message strong { display:block; margin-bottom:2px; font-size:10px; opacity:.75; }
    .chat-form { display:grid; grid-template-columns:1fr 42px; gap:8px; padding:10px; border-top:1px solid var(--line); }
    .chat-input { min-width:0; height:42px; padding:0 11px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); font-family:inherit; }
    .send { width:42px; background:var(--gold); color:var(--chalk); }
    .incoming-ring { position:fixed; z-index:5000; inset:0; display:none; place-items:center; padding:20px; background:rgba(10,24,16,.82); }
    .incoming-ring.open { display:grid; }
    .incoming-card { width:min(390px,100%); padding:28px 22px 22px; border-radius:18px; background:var(--paper); text-align:center; box-shadow:0 24px 80px rgba(0,0,0,.38); }
    .incoming-avatar { width:82px; height:82px; margin:0 auto 16px; display:grid; place-items:center; border-radius:50%; background:var(--chalk); color:#fff; font-family:'Fraunces',serif; font-size:34px; }
    .incoming-card h2 { margin:0 0 4px; color:var(--chalk); font-family:'Fraunces',serif; }
    .incoming-card p { margin:0 0 20px; color:var(--muted); }
    .incoming-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .accept { border-color:#2f6b45; background:#2f6b45; color:#fff; }
    .decline { border-color:var(--red); color:var(--red); }
    @media(max-width:820px) { .layout { grid-template-columns:1fr; } .chat-card { height:520px; } .call-frame { height:520px; } }
  </style>
</head>
<body data-team-name="{{ team_name|e }}" data-account-id="{{ current_user.id }}" data-is-owner="{{ '1' if is_full_admin_user else '0' }}">
  <div class="wrap">
    <div class="top">
      <h1>Admin team</h1>
      <a class="back" href="{{ url_for('home') }}">&larr; Back to dashboard</a>
    </div>
    <div class="layout">
      <section class="card call-card">
        <div class="call-head"><strong>Team call</strong><span class="call-status" id="callStatus">Checking...</span></div>
        <iframe class="call-frame" id="callFrame" title="Clavis team call" allow="camera; microphone; fullscreen; display-capture" allowfullscreen></iframe>
        <div class="call-empty" id="callEmpty">No active call. Start a video or audio room for the team.</div>
        <div class="call-actions">
          <button class="primary" id="videoCall" type="button">Start video call</button>
          <button id="audioCall" type="button">Start audio call</button>
          {% if is_full_admin_user %}<button class="danger" id="endCall" type="button" hidden>End call</button>{% endif %}
        </div>
      </section>

      <section class="card chat-card">
        <div class="chat-head">Team messages</div>
        <div class="chat-log" id="chatLog" aria-live="polite"></div>
        <form class="chat-form" id="chatForm">
          <input class="chat-input" id="chatInput" maxlength="2000" autocomplete="off" placeholder="Message admins and co-admins..." aria-label="Message">
          <button class="send" id="chatSend" type="submit" aria-label="Send">&rarr;</button>
        </form>
      </section>
    </div>
  </div>

  <div class="incoming-ring" id="incomingRing" role="dialog" aria-modal="true" aria-label="Incoming team call">
    <div class="incoming-card">
      <div class="incoming-avatar" id="incomingAvatar">C</div>
      <h2 id="incomingName">Incoming team call</h2>
      <p id="incomingKind">Clavis team is calling...</p>
      <div class="incoming-actions">
        <button class="decline" id="declineCall" type="button">Decline</button>
        <button class="accept" id="acceptCall" type="button">Answer</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var teamName = document.body.dataset.teamName || 'Team member';
      var accountId = parseInt(document.body.dataset.accountId || '0', 10);
      var isOwner = document.body.dataset.isOwner === '1';
      var chatLog = document.getElementById('chatLog');
      var chatForm = document.getElementById('chatForm');
      var chatInput = document.getElementById('chatInput');
      var chatSend = document.getElementById('chatSend');
      var lastId = 0;
      var seen = {};
      var activeCall = null;
      var incomingCallShown = false;

      async function subscribeToTeamPush() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
        try {
          if (Notification.permission === 'default') await Notification.requestPermission();
          if (Notification.permission !== 'granted') return;
          var registration = await navigator.serviceWorker.ready;
          var keyResponse = await fetch('/api/team/push/vapid-public-key', { credentials:'same-origin' });
          var keyData = await keyResponse.json();
          if (!keyData.publicKey) return;
          var convertedKey = urlBase64ToUint8Array(keyData.publicKey);
          var subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: convertedKey
          });
          await fetch('/api/team/push/subscribe', {
            method:'POST',
            credentials:'same-origin',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({subscription:subscription.toJSON()})
          });
        } catch (_) {}
      }

      function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = window.atob(base64);
        var output = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) output[i] = raw.charCodeAt(i);
        return output;
      }

      function addMessage(message) {
        if (seen[message.id]) return;
        seen[message.id] = true;
        if (message.id > lastId) lastId = message.id;
        var item = document.createElement('div');
        item.className = 'message' + (message.senderName === teamName ? ' mine' : '');
        var sender = document.createElement('strong');
        sender.textContent = message.senderName + ' · ' + message.senderRole;
        item.appendChild(sender);
        item.appendChild(document.createTextNode(message.body));
        chatLog.appendChild(item);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      async function pollMessages(initial) {
        try {
          var response = await fetch('/api/team/messages?after=' + (initial ? '0' : lastId), { credentials:'same-origin' });
          var data = await response.json();
          if (!response.ok) return;
          (data.messages || []).forEach(addMessage);
        } catch (_) {}
      }

      chatForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        var body = chatInput.value.trim();
        if (!body || chatSend.disabled) return;
        chatSend.disabled = true;
        try {
          var response = await fetch('/api/team/messages', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({body:body}) });
          var data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not send message.');
          chatInput.value = '';
          addMessage(data.message);
        } catch (error) { alert(error.message); }
        finally { chatSend.disabled = false; chatInput.focus(); }
      });

      var callFrame = document.getElementById('callFrame');
      var callEmpty = document.getElementById('callEmpty');
      var callStatus = document.getElementById('callStatus');
      var videoButton = document.getElementById('videoCall');
      var audioButton = document.getElementById('audioCall');
      var endButton = document.getElementById('endCall');
      var incomingRing = document.getElementById('incomingRing');
      var incomingName = document.getElementById('incomingName');
      var incomingKind = document.getElementById('incomingKind');
      var incomingAvatar = document.getElementById('incomingAvatar');
      var acceptCall = document.getElementById('acceptCall');
      var declineCall = document.getElementById('declineCall');

      function roomUrl(call) {
        var domain = call.domain || 'meet.jit.si';
        var params = new URLSearchParams();
        params.set('config.startWithAudioOnly', call.kind === 'audio' ? 'true' : 'false');
        params.set('config.startWithVideoMuted', call.kind === 'audio' ? 'true' : 'false');
        params.set('config.prejoinPageEnabled', 'true');
        params.set('userInfo.displayName', teamName);
        var safeDomain = String(domain).replace(/^https?:\/\//, '').replace(/\/$/, '');
        return 'https://' + safeDomain + '/' + encodeURIComponent(call.roomName) + '#' + params.toString();
      }

      async function openCall(call) {
        activeCall = call;
        callFrame.src = roomUrl(call);
        callFrame.classList.add('open');
        callEmpty.hidden = true;
        callStatus.textContent = 'In active call · ' + call.kind;
        videoButton.textContent = 'Join video call';
        audioButton.textContent = 'Join audio call';
        if (endButton) endButton.hidden = !isOwner;
      }

      async function startOrJoin(kind) {
        try {
          var response = await fetch('/api/team/call', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({kind:kind}) });
          var data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not start the call.');
          openCall(data.call);
        } catch (error) { alert(error.message); }
      }

      async function pollCallStatus() {
        try {
          var response = await fetch('/api/team/call', { credentials:'same-origin' });
          var data = await response.json();
          if (!response.ok) return;
          if (data.call) {
            activeCall = data.call;
            callStatus.textContent = 'Active call · ' + data.call.kind;
            videoButton.textContent = 'Join video call';
            audioButton.textContent = 'Join audio call';
            if (!incomingCallShown && data.call.startedById !== accountId && !callFrame.classList.contains('open')) {
              incomingCallShown = true;
              incomingName.textContent = data.call.startedBy || 'Incoming team call';
              incomingKind.textContent = 'Incoming ' + data.call.kind + ' call from the Clavis team';
              incomingAvatar.textContent = (data.call.startedBy || 'C').charAt(0).toUpperCase();
              incomingRing.classList.add('open');
            }
          } else {
            activeCall = null;
            incomingCallShown = false;
            incomingRing.classList.remove('open');
            callStatus.textContent = 'No active call';
            videoButton.textContent = 'Start video call';
            audioButton.textContent = 'Start audio call';
            if (callFrame.classList.contains('open')) {
              callFrame.classList.remove('open');
              callFrame.src = 'about:blank';
              callEmpty.hidden = false;
            }
            if (endButton) endButton.hidden = true;
          }
        } catch (_) {}
      }

      acceptCall.addEventListener('click', function () {
        incomingRing.classList.remove('open');
        incomingCallShown = false;
        if (activeCall) openCall(activeCall);
      });
      declineCall.addEventListener('click', function () {
        incomingRing.classList.remove('open');
        incomingCallShown = false;
      });

      videoButton.addEventListener('click', function () { startOrJoin(activeCall ? activeCall.kind === 'audio' ? 'video' : 'video' : 'video'); });
      audioButton.addEventListener('click', function () { startOrJoin(activeCall ? activeCall.kind : 'audio'); });
      if (endButton) endButton.addEventListener('click', async function () {
        if (!confirm('End the team call for everyone?')) return;
        await fetch('/api/team/call', { method:'DELETE', credentials:'same-origin' });
        pollCallStatus();
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }
      pollMessages(true);
      pollCallStatus();
      subscribeToTeamPush();
      setInterval(function () { if (!document.hidden) { pollMessages(false); pollCallStatus(); } }, 5000);
    })();
  </script>
</body>
</html>
