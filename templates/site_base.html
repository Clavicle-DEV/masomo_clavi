<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mentis{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#14301f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_versioned('css/sites.css') }}">
</head>
<body class="site">
  <div class="shell">
    <aside class="side" id="side">
      <a class="brand" href="{{ site_home }}"><img src="/static/images/icon-192.png" alt=""><span>{% block brand_name %}Mentis{% endblock %}<small>{% block site_label %}{% endblock %}</small></span></a>
      <nav class="nav">{% block nav %}{% endblock %}</nav>
      <div class="foot nav"><a href="{{ url_for('logout') }}"><span class="ico">&#x21AA;</span>Log out</a></div>
    </aside>
    <main class="main">
      {% with messages = get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-menu]')) document.body.classList.toggle('menu-open');
      else if (!e.target.closest('#side')) document.body.classList.remove('menu-open');
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
